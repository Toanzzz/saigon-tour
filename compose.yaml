services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: saigon
      POSTGRES_PASSWORD: saigon
      POSTGRES_DB: saigon
    ports:
      - '127.0.0.1:58002:5432'
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U saigon -d saigon']
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    profiles: [api]
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      DATABASE_URL: postgres://saigon:saigon@db:5432/saigon
      CORS_ORIGINS: http://localhost:58000,http://127.0.0.1:58000,http://localhost:58003,http://127.0.0.1:58003
      META_MUSE_API_KEY: ${META_MUSE_API_KEY:-}
      META_MODEL: ${META_MODEL:-muse-spark-1.3-contributor}
      META_SPEND_LIMIT_USD: ${META_SPEND_LIMIT_USD:-5}
      NPC_BARK_DAILY_LIMIT: ${NPC_BARK_DAILY_LIMIT:-200}
    ports:
      - '127.0.0.1:58001:58001'
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres:
